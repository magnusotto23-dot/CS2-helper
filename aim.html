<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 Helper - Aim Trainer</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: white;
      text-align: center;
    }

    header {
      background: #161b22;
      padding: 25px;
    }

    h1 {
      margin: 0;
    }

    .container {
      padding: 25px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 15px;
      padding: 25px;
      margin: 20px auto;
      max-width: 500px;
    }

    button {
      background: #238636;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 15px 25px;
      font-size: 17px;
      font-weight: bold;
      margin: 8px;
    }

    button:hover {
      opacity: 0.8;
    }

    a {
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🎯 AIM TRAINER</h1>
  <p>Bliv bedre til dit aim i CS2</p>
</header>

<div class="container">

  <div class="card">
    <h2>AK-47</h2>
    <p>Træn din crosshair placement og flicks.</p>
    <button onclick="startTraining('AK-47')">Start træning</button>
  </div>

  <div class="card">
    <h2>M4A1-S / M4A4</h2>
    <p>Arbejd med spray control og præcision.</p>
    <button>Start træning</button>
  </div>

  <div class="card">
    <h2>AWP</h2>
    <p>Træn flicks, reaction time og quick-scoping.</p>
    <button>Start træning</button>
  </div>

  <br>

  <a href="index.html">
    <button>← Tilbage til forsiden</button>
  </a>

</div>

</body>
</html>
