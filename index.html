<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 Helper</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: white;
    }

    header {
      background: #161b22;
      padding: 25px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 35px;
    }

    .subtitle {
      color: #8b949e;
      margin-top: 8px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 15px;
      padding: 20px;
      margin: 15px 0;
    }

    .card h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #238636;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

<header>
  <h1>CS2 HELPER</h1>
  <div class="subtitle">Improve your Counter-Strike 2 game</div>
</header>

<div class="container">

  <div class="card">
    <h2>🎯 Aim Training</h2>
    <p>Træn din aim, flicks og counter-strafing.</p>
    <a href="aim.html">
  <button>Start Aim Training</button>
</a>
  </div>

  <div class="card">
    <h2>🗺️ Maps</h2>
    <p>Lær callouts, positioner og gode steder at spille.</p>
    <button>View Maps</button>
  </div>

  <div class="card">
    <h2>💣 Grenades</h2>
    <p>Find nyttige smokes, flashes og molotovs.</p>
    <button>View Grenades</button>
  </div>

  <div class="card">
    <h2>🧠 Game Sense</h2>
    <p>Bliv bedre til beslutninger, rotations og positioning.</p>
    <button>Learn Game Sense</button>
  </div>

</div>

</body>
</html>
